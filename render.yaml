services:
  - type: web
    name: daytona-proxy
    runtime: docker
    dockerfilePath: ./go/Dockerfile
    dockerContext: ./go
    plan: starter
    healthCheckPath: /health
    domains:
      - brainbaselabs.space
      - "*.brainbaselabs.space"
    envVars:
      - key: MAS_BASE_URL
        sync: false
      - key: PREVIEW_RESOLVE_SECRET
        sync: false
      - key: PREVIEW_BASE_DOMAIN
        value: brainbaselabs.space
      # Where hyphenated hosts - published Interfaces dashboards - are
      # forwarded. Set in the dashboard, not here: it is an internal address.
      # Left unset, dashboard hosts are refused and previews are unaffected.
      - key: INTERFACES_GATEWAY_URL
        sync: false
